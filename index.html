<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동네안심길 - ansimgil</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=894d3481b0040f5f9b3de9972193f07d&autoload=false"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#f4f6f8}
header{min-height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}header b{white-space:nowrap}
#msg{background:#fef3c7;padding:8px 12px;font-size:13px}
#map{height:520px;background:#e8eaf6}
.panel{padding:14px 16px;background:#fff;max-width:1100px;margin:0 auto}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}button.active{background:#0b2f6b;color:#fff;border-color:#0b2f6b}
.mode-btn{font-size:11px;padding:6px 8px;line-height:1.2}.mode-btn .ico{font-size:16px;display:block;line-height:1}
input[type=text]{flex:1;min-width:140px;padding:9px 10px;border:1px solid #ddd;border-radius:10px}.card{margin-top:8px;background:#f8fafc;border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.5}.small{font-size:12px;color:#666}
#layerPanel{display:none;position:fixed;right:10px;top:62px;width:320px;max-width:92vw;max-height:80vh;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#layerPanel label{display:inline-block;margin:3px 6px 3px 0;font-size:13px;background:#f8fafc;border:1px solid #eee;border-radius:999px;padding:5px 9px}
.memo{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #eee;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px;background:#fff;overflow:hidden}.memo .txt{flex:1;min-width:0;word-break:break-all;line-height:1.5;cursor:pointer}.memo .txt.has-route:hover{background:#eff6ff}.memo button{float:none!important;position:static!important;flex-shrink:0;padding:6px 10px;font-size:12px}
.saved{border:1px solid #dbeafe;background:#eff6ff;border-radius:10px;padding:8px;font-size:13px;margin-top:6px}
.score{margin-top:8px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:10px}.score b{font-size:22px}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:4px 0 8px}.bar div{height:100%;background:#059669}.layerRow{margin:6px 0;font-size:13px}</style></head><body>
<header><b>동네안심길</b><span style="font-size:12px;color:#666">카카오맵 / 위치연결 / 메모 · ansimgil</span><span style="margin-left:auto"></span><button onclick="toggleLayer()">레이어 접기/펼치기</button></header>
<div id="msg">카카오 지도 불러오는 중…</div>
<div id="map"></div>
<div id="layerPanel"><b>안전 레이어</b><div style="margin:6px 0"><label style="background:#fff"><input type="checkbox" id="showLayersChk" onchange="toggleShowLayers()"> 지도에 레이어 보이기 (기본 숨김)</label></div><div class="small" style="line-height:1.6;margin:6px 0">체크한 항목을 지도에 표시해요.<br>위험지역이 보이면 그 길은 피하고, 안전시설이 보이면 그 길로 가요.</div><div id="layers"></div><div id="wmsStatus" class="small" style="margin-top:8px"></div></div>
<div class="panel"><div class="row"><label style="font-size:13px"><input type="checkbox" id="useLoc" onchange="onLocToggle()"> 📍 내 위치를 출발로 연결</label>
<button id="mode-walk" class="active mode-btn" onclick="setMode('walk')"><span class="ico">🚶</span>도보</button><button id="mode-bike" class="mode-btn" onclick="setMode('bike')"><span class="ico">🚲</span>자전거</button><button id="mode-car" class="mode-btn" onclick="setMode('car')"><span class="ico">🚗</span>차량</button><button onclick="swapAB()">출발↔도착 바꾸기</button><button onclick="resetRoute()" style="background:#fee2e2">루트 초기화</button><button class="primary" onclick="saveRoute()" style="background:#0b2f6b;color:#fff;border-color:#0b2f6b">루트 저장</button></div>
<div class="row" style="margin-top:8px"><span class="small" id="step">1단계: 지도에서 출발을 찍으세요</span></div>
<div class="card" id="routeInfo">아직 루트가 없어요. 출발과 도착을 찍으면 안심루트를 찾아요.</div>
<div class="score" id="safetyBox" style="display:none"><b id="safetyScore">안전 점수 0점</b> <span class="small" id="safetyGrade"></span><div class="bar"><div id="safetyBar" style="width:0%"></div></div><div id="layerScore" style="font-size:13px;line-height:1.8"></div><div style="font-size:13px;line-height:1.6" id="safetyWhy"></div><div style="font-size:13px;line-height:1.6" id="safetyDetail"></div></div>
<div class="row" style="margin-top:8px"><input id="memoText" type="text" placeholder="메모를 적어보세요 (루트가 있으면 같이 저장돼요)"><button onclick="addMemo()">메모 저장</button></div><div id="memoList"></div>
<h3 style="margin:16px 0 4px;font-size:15px">저장한 루트</h3><div id="savedList"><div class="small">아직 저장한 루트가 없어요.</div></div></div>
<script>
const LAYERS=[
 {cat:'치안안전',name:'범죄주의구간(전체)',code:'IF_0087'},{cat:'치안안전',name:'어린이대상범죄주의구간',code:'IF_0081'},{cat:'치안안전',name:'노인대상범죄주의구간',code:'IF_0082'},{cat:'치안안전',name:'여성밤길치안안전 - 전체',code:'IF_0080'},{cat:'치안안전',name:'치안사고통계(전체)',code:'IF_0075'},{cat:'치안안전',name:'치안시설',code:'IF_0036'},{cat:'치안안전',name:'아동안전지킴이집',code:'IF_0055'},
 {cat:'시설안전',name:'안전비상벨',code:'IF_0032'},{cat:'시설안전',name:'CCTV정보',code:'IF_0131'},{cat:'시설안전',name:'보안등',code:'IF_0102'},{cat:'시설안전',name:'약자보호시설',code:'IF_0053'},
 {cat:'교통안전',name:'교통사고다발구역',code:'IF_0093'},{cat:'교통안전',name:'대형교통사고발생정보',code:'IF_0094'},{cat:'교통안전',name:'상습결빙구간',code:'IF_0103'},{cat:'교통안전',name:'도로시설(가드레일)',code:'IF_0096'},{cat:'교통안전',name:'도로시설(인도)',code:'IF_0095'},{cat:'교통안전',name:'도로시설(횡단보도)',code:'IF_0097'},{cat:'교통안전',name:'도로시설(스쿨존)',code:'IF_0098'},{cat:'교통안전',name:'자전거길',code:'IF_0101'}];
var layersHidden=true;
function toggleShowLayers(){ layersHidden=!document.getElementById('showLayersChk').checked; placeAllLayersOnMap(); }
var SAFEMAP_KEY='2NG9WDGV-2NG9-2NG9-2NG9-2NG9WDGVEW';
var wmsOverlays=[];
function wmsUrlFor(code,bounds){ var sw=bounds.getSouthWest(), ne=bounds.getNorthEast(); return 'https://www.safemap.go.kr/openApiService/wms/getLayer.do?serviceKey='+encodeURIComponent(SAFEMAP_KEY)+'&layer='+encodeURIComponent(code)+'&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS='+encodeURIComponent(code)+'&BBOX='+sw.getLng()+','+sw.getLat()+','+ne.getLng()+','+ne.getLat()+'&WIDTH=1024&HEIGHT=1024&SRS=EPSG:4326&FORMAT=image/png&TRANSPARENT=TRUE'; }
function placeAllLayersOnMap(){
  if(!map) return;
  try{
    wmsOverlays.forEach(function(o){ try{o.setMap(null);}catch(e){} }); wmsOverlays=[];
    var boxes=document.querySelectorAll('#layers input[type=checkbox]');
    var bounds=map.getBounds(); var placed=0;
    LAYERS.forEach(function(L,i){
      if(boxes[i] && !boxes[i].checked) return;
      try{
        var div=document.createElement('div'); div.style.pointerEvents='none';
        var img=document.createElement('img'); img.src=wmsUrlFor(L.code,bounds); img.style.width='100vw'; img.style.maxWidth='1024px'; img.style.opacity='0.55'; img.style.pointerEvents='none'; img.onerror=function(){ this.style.display='none'; };
        div.appendChild(img);
        var ov=new kakao.maps.CustomOverlay({position:map.getCenter(), content:div, yAnchor:0.5, xAnchor:0.5});
        if(!layersHidden){ ov.setMap(map); }
        wmsOverlays.push(ov); placed++;
      }catch(e){}
    });
    var st=document.getElementById('wmsStatus'); if(st) st.textContent='지도에 배치됨: '+placed+'/19개 - 현재 '+(layersHidden?'전부 숨김':'보임');
  }catch(e){ var st2=document.getElementById('wmsStatus'); if(st2) st2.textContent='레이어 배치 실패 (지도는 정상): '+e.message; }
}
var map=null, markers={}, routeLine=null, A=null, B=null, mode='walk', lastRoute=null, lastScore=null;
function showMsg(t,c){var m=document.getElementById('msg');m.textContent=t;m.style.background=c;}
if(typeof kakao==='undefined'){ showMsg('카카오 SDK가 안 불러와졌어요','#fecaca'); }
else{
  kakao.maps.load(function(){
    try{ map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5665,126.9780),level:5}); showMsg('카카오 지도 열렸어요 v3-894d','#dcfce7'); kakao.maps.event.addListener(map,'click',function(e){onMapClick(e.latLng.getLat(),e.latLng.getLng());}); }catch(e){ showMsg('지도 생성 실패: '+e.message,'#fecaca'); return; }
    try{ renderLayers(); loadMemos(); loadSaved(); }catch(e){}
    try{ placeAllLayersOnMap(); }catch(e){}
    try{ var _t=null; kakao.maps.event.addListener(map,'bounds_changed',function(){ clearTimeout(_t); _t=setTimeout(function(){ try{ placeAllLayersOnMap(); }catch(e){} },800); }); }catch(e){}
  });
}
function onLocToggle(){var on=document.getElementById('useLoc').checked;if(!on)return;if(!navigator.geolocation){alert('위치 지원 안 함');document.getElementById('useLoc').checked=false;return;}navigator.geolocation.getCurrentPosition(function(p){A={lat:p.coords.latitude,lng:p.coords.longitude};setPin('출발',A.lat,A.lng);document.getElementById('step').textContent='내 위치를 출발로 했어요. 이제 도착을 찍으세요.';if(B)findRoute();},function(){alert('위치 권한 허용 필요');document.getElementById('useLoc').checked=false;});}
function onMapClick(lat,lng){if(!map)return;if(!A){A={lat:lat,lng:lng};setPin('출발',lat,lng);document.getElementById('step').textContent='출발 찍었어요. 이제 도착을 찍으세요.';}else if(!B){B={lat:lat,lng:lng};setPin('도착',lat,lng);document.getElementById('step').textContent='도착 찍었어요. 안심루트 찾는 중…';findRoute();}else{B={lat:lat,lng:lng};setPin('도착',lat,lng);findRoute();}}
function setPin(which,lat,lng){if(markers[which])markers[which].setMap(null);markers[which]=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),map:map});map.setCenter(new kakao.maps.LatLng(lat,lng));}
async function findRoute(){if(!A||!B)return;var prof=mode==='walk'?'walking':mode==='bike'?'cycling':'driving';var url='https://router.project-osrm.org/route/v1/'+prof+'/'+A.lng+','+A.lat+';'+B.lng+','+B.lat+'?overview=full&geometries=geojson&alternatives=3';try{var r=await fetch(url);var j=await r.json();var best=(j.routes||[])[0];if(!best)throw new Error('no route');if(routeLine)routeLine.setMap(null);var path=best.geometry.coordinates.map(function(c){return new kakao.maps.LatLng(c[1],c[0]);});routeLine=new kakao.maps.Polyline({path:path,strokeWeight:6,strokeColor:'#0b2f6b',strokeOpacity:.9});routeLine.setMap(map);lastRoute={A:A,B:B,mode:mode,distance:best.distance,duration:best.duration,at:new Date().toLocaleString()};document.getElementById('routeInfo').innerHTML='<b>안심루트</b> · '+(mode==='walk'?'도보':mode==='bike'?'자전거':'차량')+' · 거리 '+(best.distance/1000).toFixed(2)+'km · 약 '+Math.round(best.duration/60)+'분<br><span class="small">출발 '+A.lat.toFixed(5)+','+A.lng.toFixed(5)+' → 도착 '+B.lat.toFixed(5)+','+B.lng.toFixed(5)+'</span>';showSafety(best);}catch(e){document.getElementById('routeInfo').textContent='경로를 불러오지 못했어요.';}}
var DANGER_CODES=['IF_0087','IF_0081','IF_0082','IF_0080','IF_0075','IF_0093','IF_0094','IF_0103'];
var FACILITY_CODES=['IF_0036','IF_0055','IF_0032','IF_0131','IF_0102','IF_0053','IF_0096','IF_0095','IF_0097','IF_0098','IF_0101'];
function showSafety(best){
  var boxes=document.querySelectorAll('#layers input[type=checkbox]');
  var danger=0, facility=0, dangerNames=[], facilityNames=[];
  LAYERS.forEach(function(L,i){
    if(boxes[i] && boxes[i].checked){
      if(DANGER_CODES.indexOf(L.code)>=0){ danger++; dangerNames.push(L.name); }
      if(FACILITY_CODES.indexOf(L.code)>=0){ facility++; facilityNames.push(L.name); }
    }
  });
  var hour=new Date().getHours();var isNight=hour>=20||hour<6;
  var score=75 + (facility*2) - (danger*4);
  if(best.distance>3000) score-=4;
  if(best.distance>8000) score-=4;
  if(isNight) score-=6;
  if(mode==='walk') score+=2;
  if(mode==='bike') score+=2;
  if(score>98) score=98; if(score<40) score=40; lastScore=score;
  var grade=score>=90?'매우 안전':score>=80?'안전':score>=70?'보통':'주의 필요';
  var sidewalk = (boxes[15] && boxes[15].checked) ? '확인됨' : '없음';
  var crosswalk = (boxes[16] && boxes[16].checked) ? '확인됨' : '없음';
  document.getElementById('safetyBox').style.display='block';
  document.getElementById('safetyScore').textContent='안전 점수 '+score+'점';
  document.getElementById('safetyGrade').textContent='· '+grade;
  document.getElementById('safetyBar').style.width=score+'%';
  document.getElementById('layerScore').innerHTML='<div class="layerRow">✅ 안전시설 '+facility+'개 +'+(facility*2)+'점</div><div class="layerRow">⚠️ 위험지역 '+danger+'개 -'+(danger*4)+'점</div><div class="layerRow">🚶 인도: '+sidewalk+' · 🚸 횡단보도: '+crosswalk+'</div>';
  document.getElementById('safetyWhy').innerHTML='<b>체크한 항목으로 계산했어요</b><br>안전시설이 많을수록 +, 위험지역이 많을수록 -예요.';
  document.getElementById('safetyDetail').innerHTML='<b>이 루트에 대해</b><br>· 안전시설: '+(facilityNames.length?facilityNames.join(', '):'없음')+'<br>· 위험지역: '+(dangerNames.length?dangerNames.join(', '):'없음')+'<br>· 거리 '+(best.distance/1000).toFixed(2)+'km · '+(isNight?'밤이라 밝은 큰길 위주로 가세요.':'낮 시간이라 시야가 좋아요.');
  if(lastRoute)lastRoute.score=score;
}
function setMode(m){mode=m;document.querySelectorAll('[id^=mode-]').forEach(function(b){b.classList.remove('active')});document.getElementById('mode-'+m).classList.add('active');if(A&&B)findRoute();}
function clearAll(){A=B=null;lastRoute=null;lastScore=null;Object.values(markers).forEach(function(x){x.setMap(null)});markers={};if(routeLine)routeLine.setMap(null);document.getElementById('step').textContent='1단계: 지도에서 출발을 찍으세요';document.getElementById('routeInfo').textContent='아직 루트가 없어요.';document.getElementById('safetyBox').style.display='none';document.getElementById('useLoc').checked=false;}
function resetRoute(){clearAll();showMsg('카카오 지도 열렸어요 v3-894d','#dcfce7');}
function swapAB(){var t=A;A=B;B=t;if(A)setPin('출발',A.lat,A.lng);if(B)setPin('도착',B.lat,B.lng);if(A&&B)findRoute();}
function renderLayers(){var el=document.getElementById('layers');el.innerHTML=LAYERS.map(function(x){return '<label><input type="checkbox" checked onchange="placeAllLayersOnMap(); if(A&&B) findRoute()"> '+x.name+' <span class="small">'+x.code+'</span></label>'}).join('');}
function toggleLayer(){var p=document.getElementById('layerPanel');p.style.display=p.style.display==='none'?'block':'none';}
function loadMemos(){var arr=JSON.parse(localStorage.getItem('ansimgil_memos')||'[]');document.getElementById('memoList').innerHTML=arr.map(function(m,i){var hasRoute=m.route&&m.route.A&&m.route.B;return '<div class="memo"><div class="txt'+(hasRoute?' has-route':'')+'" onclick="showMemoRoute('+i+')"><b>'+m.date+'</b><br>'+m.text+(hasRoute?'<br><span class="small">📍 루트 있음 · 클릭하면 지도에 다시 보여요</span>':'<br><span class="small">루트 없음</span>')+'</div><button onclick="delMemo('+i+')">삭제</button></div>'}).join('')||'<div class="small">아직 메모가 없어요.</div>';}
function addMemo(){var t=document.getElementById('memoText').value.trim();if(!t)return alert('메모를 적어주세요.');var arr=JSON.parse(localStorage.getItem('ansimgil_memos')||'[]');var memo={text:t,date:new Date().toLocaleString()};if(lastRoute&&lastRoute.A&&lastRoute.B){memo.route={A:lastRoute.A,B:lastRoute.B,mode:lastRoute.mode};}arr.unshift(memo);localStorage.setItem('ansimgil_memos',JSON.stringify(arr));document.getElementById('memoText').value='';loadMemos();}
function showMemoRoute(i){var arr=JSON.parse(localStorage.getItem('ansimgil_memos')||'[]');var m=arr[i];if(!m||!m.route||!m.route.A||!m.route.B){alert('이 메모에는 저장된 루트가 없어요. 루트를 만든 뒤에 메모를 저장하면 같이 저장돼요.');return;}A=m.route.A;B=m.route.B;mode=m.route.mode||'walk';setMode(mode);setPin('출발',A.lat,A.lng);setPin('도착',B.lat,B.lng);findRoute();document.getElementById('step').textContent='메모 루트를 다시 불러왔어요.';if(map)map.setCenter(new kakao.maps.LatLng((A.lat+B.lat)/2,(A.lng+B.lng)/2));}
function delMemo(i){var arr=JSON.parse(localStorage.getItem('ansimgil_memos')||'[]');arr.splice(i,1);localStorage.setItem('ansimgil_memos',JSON.stringify(arr));loadMemos();}
function saveRoute(){if(!A||!B||!lastRoute)return alert('먼저 출발과 도착을 찍어 루트를 만드세요.');if(lastScore!=null)lastRoute.score=lastScore;var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');arr.unshift(lastRoute);localStorage.setItem('ansimgil_routes',JSON.stringify(arr));loadSaved();alert('루트 저장했어요! 안전 점수 '+lastScore+'점');}
function loadSaved(){var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');document.getElementById('savedList').innerHTML=arr.map(function(r,i){return '<div class="saved"><b>'+r.at+'</b> · '+(r.mode==='walk'?'도보':r.mode==='bike'?'자전거':'차량')+' · '+(r.distance/1000).toFixed(2)+'km'+(r.score!=null?' · 안전 '+r.score+'점':'')+'<br>출발 '+r.A.lat.toFixed(5)+','+r.A.lng.toFixed(5)+' → 도착 '+r.B.lat.toFixed(5)+','+r.B.lng.toFixed(5)+'<br><button onclick="loadRoute('+i+')">불러오기</button> <button onclick="delRoute('+i+')">삭제</button></div>'}).join('')||'<div class="small">아직 저장한 루트가 없어요.</div>';}
function loadRoute(i){var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');var r=arr[i];if(!r)return;A=r.A;B=r.B;mode=r.mode;setMode(mode);setPin('출발',A.lat,A.lng);setPin('도착',B.lat,B.lng);findRoute();}
function delRoute(i){var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');arr.splice(i,1);localStorage.setItem('ansimgil_routes',JSON.stringify(arr));loadSaved();}
</script></body></html>
