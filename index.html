<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동네안심길 - ansimgil</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#f4f6f8;color:#111}
header{height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:20}
header b{font-size:18px} header span{font-size:12px;color:#666}
#map{height:calc(100vh - 52px - 150px);min-height:380px;background:#dde}
.panel{position:fixed;left:10px;bottom:10px;right:10px;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px;z-index:30;max-height:220px;overflow:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center} button{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:999px;cursor:pointer;font-size:13px}
button.active{background:#0b2f6b;color:#fff;border-color:#0b2f6b} input[type=text]{flex:1;min-width:140px;padding:9px 10px;border:1px solid #ddd;border-radius:10px}
.card{margin-top:8px;background:#f8fafc;border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.5}
.small{font-size:12px;color:#666} .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#bbb}
.dot.ok{background:#16a34a}.dot.fail{background:#ef4444}.dot.load{background:#2563eb}
#layerPanel{display:none;position:fixed;right:10px;top:62px;width:320px;max-width:92vw;max-height:80vh;overflow:auto;background:#fff;border-radius:14px;padding:12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#memoList{margin-top:8px;display:grid;gap:6px} .memo{border:1px solid #eee;border-radius:10px;padding:8px;font-size:13px}
@media(min-width:900px){ #map{height:calc(100vh - 52px)} .panel{width:430px;right:auto;max-height:320px} }
</style></head>
<body>
<header><b>동네안심길</b><span>카카오맵 / 위치연결 / 메모 · ansimgil</span><span style="margin-left:auto"></span><button onclick="toggleLayer()">레이어</button><button onclick="toggleSet()">설정</button></header>
<div id="map"></div>

<div class="panel">
<div class="row">
<label style="font-size:13px"><input type="checkbox" id="useLoc" onchange="onLocToggle()"> 📍 내 위치를 출발지로 연결</label>
<button id="mode-walk" class="active" onclick="setMode('walk')">도보</button>
<button id="mode-bike" onclick="setMode('bike')">자전거</button>
<button id="mode-car" onclick="setMode('car')">차량</button>
<button onclick="clearAll()">지우기</button><button onclick="swapAB()">A↔B</button>
</div>
<div class="row" style="margin-top:8px"><span class="small" id="step">1단계: 지도에서 출발지를 찍으세요 (위치 체크하면 내 위치가 출발지가 돼요)</span></div>
<div class="card" id="routeInfo">아직 루트가 없어요. 출발지(A)와 목적지(B)를 찍으면 안심루트를 찾아요.</div>
<div class="row" style="margin-top:8px"><input id="memoText" type="text" placeholder="메모를 적어보세요. 예: 여기는 밤에 어두워요"><button onclick="addMemo()">메모 저장</button></div>
<div id="memoList"></div>
<div class="small" style="margin-top:6px">메모는 이 브라우저에만 저장돼요 (localStorage). 깃허브 Pages에서도 그대로 써요.</div>
</div>

<div id="layerPanel"><h3 style="margin:0 0 8px">레이어 <span class="small">체크하면 지도에 켜져요</span></h3><div id="layers"></div><button onclick="checkAll()" style="margin-top:10px;width:100%">전체 레이어 확인</button><div id="checkResult" class="small" style="margin-top:8px"></div></div>

<div id="layerPanel2" style="display:none"></div>

function initLeaflet(){
  map = L.map('map').setView([37.5665,126.9780],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  map.on('click',e=>onMapClick(e.latlng.lat,e.latlng.lng));
}
function initKakao(){
  const s=document.createElement('script'); s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_JS_KEY+'&autoload=false';
  s.onload=()=>{ kakao.maps.load(()=>{ const c=new kakao.maps.LatLng(37.5665,126.9780); map=new kakao.maps.Map(document.getElementById('map'),{center:c,level:5});

  s.onerror=()=>{ document.getElementById('map').innerHTML=''; initLeaflet(); };
  document.head.appendChild(s);
}
if(useKakao) initKakao(); else initLeaflet();

function onLocToggle(){
  const on=document.getElementById('useLoc').checked;
  if(!on) return;

  navigator.geolocation.getCurrentPosition(p=>{
    A={lat:p.coords.latitude,lng:p.coords.longitude,label:'내 위치'};
    setPin('A',A.lat,A.lng); document.getElementById('step').textContent='내 위치를 출발지로 했어요. 이제 지도에서 목적지를 찍으세요.';
    if(B) findRoute();
  },()=>{ alert('위치 권한을 허용해주세요.'); document.getElementById('useLoc').checked=false; });
}
function onMapClick(lat,lng){
  if(!A){ A={lat,lng,label:'지도 선택'}; setPin('A',lat,lng); document.getElementById('step').textContent='출발지 찍었어요. 이제 목적지를 찍으세요.'; }

  else { B={lat,lng,label:'지도 선택'}; setPin('B',lat,lng); findRoute(); }
}
