<header><b>🛡️ 동네안심길</b><span style="margin-left:auto"></span><button onclick="toggleLayer()">레이어</button></header>
<div id="msg"></div>
<div class="layout">
<div class="mapWrap"><div id="map"></div></div>
<div class="panel">
<span class="safeBadge">🛡️ 안전한 길만 안내해요</span>
<div class="titleWrap"><div class="titleIcon">🛡️</div><div><h2>우리동네<span>안심길</span></h2><p>안전한 길로, 마음 편히 걸어요</p></div></div>
<div class="searchLabel"><span class="dot dot-a"></span> 출발</div>
<div class="searchBox"><input id="fromSearch" type="text" placeholder="출발 검색" onkeydown="if(event.key==='Enter') searchPlace('A')"><button onclick="searchPlace('A')">찾기</button></div>
<div id="fromResults" class="searchRes"></div>
<div class="swapWrap"><button class="swapBtn" onclick="swapAB()" title="출발 ↔ 도착 바꾸기">⇅</button></div>
<div class="searchLabel"><span class="dot dot-b"></span> 도착</div>
<div class="searchBox"><input id="toSearch" type="text" placeholder="도착 검색" onkeydown="if(event.key==='Enter') searchPlace('B')"><button onclick="searchPlace('B')">찾기</button></div>
<div id="toResults" class="searchRes"></div>
<div class="confirmRow"><button class="confirmBtn" onclick="confirmRoute()">확인</button><button class="resetBtn" onclick="resetRoute()">루트 초기화</button></div>
<div class="row"><button id="mode-walk" class="active mode-btn" onclick="setMode('walk')"><span class="ico">🚶</span>도보</button><button id="mode-bike" class="mode-btn" onclick="setMode('bike')"><span class="ico">🚲</span>자전거</button><button id="mode-car" class="mode-btn" onclick="setMode('car')"><span class="ico">🚗</span>차량</button><label class="loc-pill"><input type="checkbox" id="useLoc" onchange="onLocToggle()"> 📍 내 위치를 출발로 연결</label></div>
<div class="card" id="routeInfo">—</div>
<div class="score" id="safetyBox" style="display:none"><b id="safetyScore">안전 점수 0점</b> <span id="safetyGrade"></span><div class="bar"><div id="safetyBar" style="width:0%"></div></div><div id="safetyFac">✅ 안전시설 0개 +0점</div><div id="safetyDanger">⚠️ 위험지역 0개 -0점</div><div id="safetyDetail">🚶 인도: 확인됨 · 🔶 횡단보도: 확인됨</div></div>
<div class="memoRow"><input id="memoText" type="text" placeholder="메모"><button onclick="saveRoute()">루트 저장</button></div>
<h3 style="margin:7px 0 5px;font-size:14px">내 안심루트</h3><div id="savedList"><div class="small">—</div></div>
</div>
</div>
<div id="layerPanel"><b>안전 레이어</b><div style="margin:6px 0"><label><input type="checkbox" id="showLayersChk" onchange="toggleShowLayers()"> 지도에 레이어 보이기</label></div><div id="layers"></div><div id="wmsStatus" class="small" style="margin-top:8px"></div></div>
<script>
const LAYERS=[
 {cat:'치안안전',name:'범죄주의구간(전체)',code:'IF_0087'},{cat:'치안안전',name:'어린이대상범죄주의구간',code:'IF_0081'},{cat:'치안안전',name:'노인대상범죄주의구간',code:'IF_0082'},{cat:'치안안전',name:'여성밤길치안안전 - 전체',code:'IF_0080'},{cat:'치안안전',name:'치안사고통계(전체)',code:'IF_0075'},{cat:'치안안전',name:'치안시설',code:'IF_0036'},{cat:'치안안전',name:'아동안전지킴이집',code:'IF_0055'},
 {cat:'시설안전',name:'안전비상벨',code:'IF_0032'},{cat:'시설안전',name:'CCTV정보',code:'IF_0131'},{cat:'시설안전',name:'보안등',code:'IF_0102'},{cat:'시설안전',name:'약자보호시설',code:'IF_0053'},
 {cat:'교통안전',name:'교통사고다발구역',code:'IF_0093'},{cat:'교통안전',name:'대형교통사고발생정보',code:'IF_0094'},{cat:'교통안전',name:'상습결빙구간',code:'IF_0103'},{cat:'교통안전',name:'도로시설(가드레일)',code:'IF_0096'},{cat:'교통안전',name:'도로시설(인도)',code:'IF_0095'},{cat:'교통안전',name:'도로시설(횡단보도)',code:'IF_0097'},{cat:'교통안전',name:'도로시설(스쿨존)',code:'IF_0098'},{cat:'교통안전',name:'자전거길',code:'IF_0101'}];
var ROUTE_COLORS=['#0b2f6b','#059669','#d97706','#dc2626','#7c3aed','#db2777','#0891b2','#65a30d','#ea580c','#0f766e'];
var pendingRouteColor=null;
var layersHidden=true;
var fromName='', toName='';
var safetyVisible=false;
function toggleShowLayers(){ layersHidden=!document.getElementById('showLayersChk').checked; placeAllLayersOnMap(); }
var SAFEMAP_KEY='2NG9WDGV-2NG9-2NG9-2NG9-2NG9WDGVEW';
var wmsOverlays=[];
function wmsUrlFor(code,bounds){ var sw=bounds.getSouthWest(), ne=bounds.getNorthEast(); return 'https://www.safemap.go.kr/openApiService/wms/getLayer.do?serviceKey='+encodeURIComponent(SAFEMAP_KEY)+'&layer='+encodeURIComponent(code)+'&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS='+encodeURIComponent(code)+'&BBOX='+sw.getLng()+','+sw.getLat()+','+ne.getLng()+','+ne.getLat()+'&WIDTH=1024&HEIGHT=1024&SRS=EPSG:4326&FORMAT=image/png&TRANSPARENT=TRUE'; }
function placeAllLayersOnMap(){
  if(!map) return;
  try{
    wmsOverlays.forEach(function(o){ try{o.setMap(null);}catch(e){} }); wmsOverlays=[];
    var boxes=document.querySelectorAll('#layers input[type=checkbox]');
    var bounds=map.getBounds(); var placed=0;
    LAYERS.forEach(function(L,i){
      if(boxes[i] && !boxes[i].checked) return;
      try{
        var div=document.createElement('div'); div.style.pointerEvents='none';
        var img=document.createElement('img'); img.src=wmsUrlFor(L.code,bounds); img.style.width='100vw'; img.style.maxWidth='1024px'; img.style.opacity='0.55'; img.style.pointerEvents='none'; img.onerror=function(){ this.style.display='none'; };
        div.appendChild(img);
        var ov=new kakao.maps.CustomOverlay({position:map.getCenter(), content:div, yAnchor:0.5, xAnchor:0.5, clickable:false});
        if(!layersHidden){ ov.setMap(map); }
        wmsOverlays.push(ov); placed++;
      }catch(e){}
    });
    var st=document.getElementById('wmsStatus'); if(st) st.textContent='지도에 배치됨: '+placed+'/19개 - 현재 '+(layersHidden?'전부 숨김':'보임');
  }catch(e){ var st2=document.getElementById('wmsStatus'); if(st2) st2.textContent='레이어 배치 실패 (지도는 정상): '+e.message; }
}
var map=null, markers={}, routeLine=null, A=null, B=null, mode='walk', lastRoute=null, lastScore=null, placesService=null, geocoder=null, currentSearchTarget='A';
function showMsg(t,c){var m=document.getElementById('msg');if(!t){m.style.display='none';return;}m.style.display='block';m.textContent=t;m.style.background=c;}
function fillInputFromClick(which, lat, lng){
  var inputId = which==='A' ? 'fromSearch' : 'toSearch';
  var input = document.getElementById(inputId);
  var tempName = '지도 찍은 위치 ('+lat.toFixed(5)+', '+lng.toFixed(5)+')';
  if(which==='A'){ fromName=tempName; } else { toName=tempName; }
  if(input) { input.value=tempName; input.style.background='#fff7ed'; setTimeout(function(){ input.style.background='transparent'; },600); }
  if(geocoder){
    try{
      geocoder.coord2Address(lng, lat, function(result, status){
        if(status===kakao.maps.services.Status.OK && result && result[0]){
          var addr = (result[0].road_address && result[0].road_address.address_name) || (result[0].address && result[0].address.address_name) || '';
          if(addr){
            if(which==='A'){ fromName=addr; } else { toName=addr; }
            if(input) input.value=addr;
            if(A&&B && lastRoute){ lastRoute.fromName=fromName; lastRoute.toName=toName; }
          }
        }
      });
    }catch(e){}
  }
}
function initMap(){
  try{
    map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5665,126.9780),level:5});
    if(window.kakao.maps.services){ placesService=new kakao.maps.services.Places(); geocoder=new kakao.maps.services.Geocoder(); }
    kakao.maps.event.addListener(map,'click',function(e){ onMapClick(e.latLng.getLat(), e.latLng.getLng()); });
    renderLayers(); loadSaved();
    placeAllLayersOnMap();
    setTimeout(function(){ try{ map.relayout(); map.setCenter(new kakao.maps.LatLng(37.5665,126.9780)); }catch(e){} },200);
    window.addEventListener('resize',function(){ try{ map.relayout(); }catch(e){} });
    var _t=null; kakao.maps.event.addListener(map,'bounds_changed',function(){ clearTimeout(_t); _t=setTimeout(function(){ try{ placeAllLayersOnMap(); }catch(e){} },800); });
  }catch(e){ showMsg('지도 생성 실패: '+e.message,'#fecaca'); }
}
if(typeof kakao==='undefined'){ showMsg('카카오 SDK가 안 불러와졌어요','#fecaca'); }
else{
  kakao.maps.load(initMap);
  setTimeout(function(){ if(!map) showMsg('지도가 안 떴어요','#fecaca'); },3000);
}
function onLocToggle(){var on=document.getElementById('useLoc').checked;if(!on)return;if(!navigator.geolocation){alert('위치 지원 안 함');document.getElementById('useLoc').checked=false;return;}navigator.geolocation.getCurrentPosition(function(p){A={lat:p.coords.latitude,lng:p.coords.longitude};fromName='내 위치';document.getElementById('fromSearch').value=fromName;setPin('출발',A.lat,A.lng);document.getElementById('toSearch').focus();if(B)findRoute(false);},function(){alert('위치 권한 허용 필요');document.getElementById('useLoc').checked=false;});}
function onMapClick(lat,lng){
  if(!map) return;
  if(!A){ A={lat:lat,lng:lng}; setPin('출발',lat,lng); fillInputFromClick('A',lat,lng); }
  else if(!B){ B={lat:lat,lng:lng}; setPin('도착',lat,lng); fillInputFromClick('B',lat,lng); findRoute(false); }
  else{ B={lat:lat,lng:lng}; setPin('도착',lat,lng); fillInputFromClick('B',lat,lng); findRoute(false); }
}
function setPin(which,lat,lng){if(markers[which])markers[which].setMap(null);markers[which]=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),map:map,clickable:false});map.setCenter(new kakao.maps.LatLng(lat,lng));}
function searchPlace(target){ currentSearchTarget=target||'A'; var inputId=target==='A'?'fromSearch':'toSearch'; var kw=document.getElementById(inputId).value.trim(); if(!kw) return; quickSearch(kw,target); }
function quickSearch(kw, target){
  currentSearchTarget=target||'A';
  var targetAtCall = target||'A';
  if(!placesService){ alert('장소 검색이 아직 준비 안 됐어요.'); return; }
  placesService.keywordSearch(kw, function(data,status){
    var boxId=targetAtCall==='A'?'fromResults':'toResults';
    if(status!==kakao.maps.services.Status.OK || !data.length){ document.getElementById(boxId).innerHTML='<div class="small">검색 결과가 없어요.</div>'; return; }
    var list=data.slice(0,5);
    document.getElementById(boxId).innerHTML=list.map(function(p){
      var name=(p.place_name||'').replace(/'/g,'’').replace(/"/g,'”');
      var lat=parseFloat(p.y), lng=parseFloat(p.x);
      return '<div onclick="pickPlaceDirect(\''+targetAtCall+'\', '+lat+', '+lng+', \''+name+'\')"><b>'+escHtml(p.place_name)+'</b><br><span class="small">'+escHtml(p.road_address_name||p.address_name||'')+'</span></div>';
    }).join('');
  });
}
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pickPlaceDirect(which, lat, lng, name){
  if(!name) name='선택한 장소';
  var inputId = which==='A' ? 'fromSearch' : 'toSearch';
  var input = document.getElementById(inputId);
  if(input){ input.value=name; input.style.background='#fff7ed'; setTimeout(function(){ input.style.background='transparent'; },600); }
  if(which==='A'){
    A={lat:lat,lng:lng}; fromName=name;
    setPin('출발',lat,lng);
    document.getElementById('fromResults').innerHTML='';
    document.getElementById('toSearch').focus();
  } else {
    B={lat:lat,lng:lng}; toName=name;
    setPin('도착',lat,lng);
    document.getElementById('toResults').innerHTML='';
  }
  if(A&&B) findRoute(false);
}
function resolveTyped(which){
  return new Promise(function(resolve){
    var inputId = which==='A' ? 'fromSearch' : 'toSearch';
    var txt = document.getElementById(inputId).value.trim();
    if(!txt){ resolve(false); return; }
    if(which==='A' && A && fromName===txt){ resolve(true); return; }
    if(which==='B' && B && toName===txt){ resolve(true); return; }
    if(!placesService || !geocoder){ resolve(false); return; }
    placesService.keywordSearch(txt, function(data,status){
      if(status===kakao.maps.services.Status.OK && data && data.length){
        var p=data[0]; var lat=parseFloat(p.y), lng=parseFloat(p.x); var name=p.place_name||txt;
        if(which==='A'){ A={lat:lat,lng:lng}; fromName=name; setPin('출발',lat,lng); } else { B={lat:lat,lng:lng}; toName=name; setPin('도착',lat,lng); }
        document.getElementById(inputId).value=name; resolve(true); return;
      }
      geocoder.addressSearch(txt, function(res2,st2){
        if(st2===kakao.maps.services.Status.OK && res2 && res2.length){
          var r=res2[0]; var lat2=parseFloat(r.y), lng2=parseFloat(r.x);
          if(which==='A'){ A={lat:lat2,lng:lng2}; fromName=txt; setPin('출발',lat2,lng2); } else { B={lat:lat2,lng:lng2}; toName=txt; setPin('도착',lat2,lng2); }
          resolve(true); return;
        }
        resolve(false);
      });
    });
  });
}
async function confirmRoute(){
  if(!A) await resolveTyped('A');
  if(!B) await resolveTyped('B');
  if(!A||!B){ alert('출발과 도착을 먼저 정해주세요. 검색 결과에서 장소를 눌러 선택해야 해요.'); return; }
  safetyVisible=true;
  await findRoute(true);
  if(document.getElementById('safetyBox').style.display==='none' && lastRoute){
    try{ showSafety({distance:lastRoute.distance}); }catch(e){}
  }
}
async function fetchOneRoute(prof){
  var url='https://router.project-osrm.org/route/v1/'+prof+'/'+A.lng+','+A.lat+';'+B.lng+','+B.lat+'?overview=full&geometries=geojson&alternatives=1';
  var r=await fetch(url); var j=await r.json(); return (j.routes||[])[0]||null;
}
async function findRoute(showScore){
  if(!A||!B)return;
  var prof=mode==='walk'?'walking':mode==='bike'?'cycling':'driving';
  try{
    var best=await fetchOneRoute(prof);
    if(!best) throw new Error('no route');
    if(routeLine)routeLine.setMap(null);
    var path=best.geometry.coordinates.map(function(c){return new kakao.maps.LatLng(c[1],c[0]);});
    var lineColor=pendingRouteColor||'#0b2f6b';
    routeLine=new kakao.maps.Polyline({path:path,strokeWeight:6,strokeColor:lineColor,strokeOpacity:.9});routeLine.setMap(map);
    lastRoute={A:A,B:B,mode:mode,distance:best.distance,duration:best.duration,at:new Date().toLocaleString(),color:lineColor,fromName:fromName,toName:toName};pendingRouteColor=null;
    document.getElementById('routeInfo').innerHTML='<b>안심루트</b> · '+(mode==='walk'?'도보':mode==='bike'?'자전거':'차량')+' · 거리 '+(best.distance/1000).toFixed(2)+'km · 약 '+Math.round(best.duration/60)+'분<br><span class="small" id="modeCompare"></span>';
    if(showScore || safetyVisible){ showSafety(best); } else { document.getElementById('safetyBox').style.display='none'; lastScore=null; }
    try{
      var others = mode==='walk'?['cycling','driving']:mode==='bike'?['walking','driving']:['walking','cycling'];
      var results={}; results[prof]=best;
      for(var i=0;i<others.length;i++){ var rr=await fetchOneRoute(others[i]); if(rr) results[others[i]]=rr; }
      var cmp='도보 '+(results.walking?Math.round(results.walking.duration/60)+'분':'-')+' · 자전거 '+(results.cycling?Math.round(results.cycling.duration/60)+'분':'-')+' · 차량 '+(results.driving?Math.round(results.driving.duration/60)+'분':'-');
      var el=document.getElementById('modeCompare'); if(el) el.textContent='시간 비교: '+cmp;
    }catch(e){}
  }catch(e){document.getElementById('routeInfo').textContent='경로를 불러오지 못했어요.';}
}
function checkedCodes(){
  var boxes=document.querySelectorAll('#layers input[type=checkbox]'); var s={};
  LAYERS.forEach(function(L,i){ if(boxes[i] && boxes[i].checked) s[L.code]=true; });
  return s;
}
function showSafety(best){
  var on=checkedCodes();
  var facPlus=0, danMinus=0, facCount=0, danCount=0;
  if(mode==='walk'){
    var walkFac=['IF_0095','IF_0097','IF_0098','IF_0032','IF_0131','IF_0102','IF_0055','IF_0036'];
    walkFac.forEach(function(c){ if(on[c]){facCount++; facPlus+=3;} });
    if(on['IF_0101']){facCount++; facPlus+=1;}
    if(on['IF_0053']){facCount++; facPlus+=2;}
    if(on['IF_0096']){facCount++; facPlus+=1;}
    var walkDan=['IF_0087','IF_0081','IF_0082','IF_0080','IF_0075'];
    walkDan.forEach(function(c){ if(on[c]){danCount++; danMinus+=4;} });
    if(on['IF_0093']){danCount++; danMinus+=3;}
    if(on['IF_0094']){danCount++; danMinus+=2;}
    if(on['IF_0103']){danCount++; danMinus+=2;}
  } else if(mode==='bike'){
    if(on['IF_0101']){facCount++; facPlus+=6;}
    ['IF_0095','IF_0097','IF_0032','IF_0131','IF_0102'].forEach(function(c){ if(on[c]){facCount++; facPlus+=2;} });
    ['IF_0036','IF_0055','IF_0053','IF_0096','IF_0098'].forEach(function(c){ if(on[c]){facCount++; facPlus+=1;} });
    if(on['IF_0093']){danCount++; danMinus+=6;}
    if(on['IF_0094']){danCount++; danMinus+=5;}
    if(on['IF_0103']){danCount++; danMinus+=4;}
    ['IF_0087','IF_0081','IF_0082','IF_0080','IF_0075'].forEach(function(c){ if(on[c]){danCount++; danMinus+=2;} });
  } else {
    if(on['IF_0093']){danCount++; danMinus+=6;}
    if(on['IF_0094']){danCount++; danMinus+=6;}
    if(on['IF_0103']){danCount++; danMinus+=5;}
    if(on['IF_0096']){facCount++; facPlus+=3;}
    ['IF_0087','IF_0081','IF_0082','IF_0080','IF_0075'].forEach(function(c){ if(on[c]){danCount++; danMinus+=2;} });
    ['IF_0036','IF_0032','IF_0131','IF_0102','IF_0055','IF_0053','IF_0095','IF_0097','IF_0098','IF_0101'].forEach(function(c){ if(on[c]){facCount++; facPlus+=1;} });
  }
  var hour=new Date().getHours();var isNight=hour>=20||hour<6;
  var score=75 + facPlus - danMinus;
  if(best.distance>3000) score-=4;
  if(best.distance>8000) score-=4;
  if(isNight) score-=6;
  if(score>98) score=98; if(score<40) score=40; lastScore=score;
  var grade=score>=90?'매우 안전':score>=80?'안전':score>=70?'보통':'주의 필요';
  document.getElementById('safetyBox').style.display='block';
  document.getElementById('safetyScore').textContent='안전 점수 '+score+'점';
  document.getElementById('safetyGrade').textContent='· '+grade;
  document.getElementById('safetyBar').style.width=score+'%';
  document.getElementById('safetyFac').textContent='✅ 안전시설 '+facCount+'개 +'+facPlus+'점';
  document.getElementById('safetyDanger').textContent='⚠️ 위험지역 '+danCount+'개 -'+danMinus+'점';
  var walkTxt = mode==='walk' ? '🚶 인도: '+(on['IF_0095']?'확인됨':'없음')+' · 🔶 횡단보도: '+(on['IF_0097']?'확인됨':'없음')+' · 스쿨존: '+(on['IF_0098']?'확인됨':'없음') : mode==='bike' ? '🚲 자전거길: '+(on['IF_0101']?'확인됨':'없음')+' · 🚶 인도: '+(on['IF_0095']?'확인됨':'없음')+' · 🔶 횡단보도: '+(on['IF_0097']?'확인됨':'없음') : '🚗 가드레일: '+(on['IF_0096']?'확인됨':'없음')+' · 결빙구간: '+(on['IF_0103']?'주의':'없음')+' · 교통사고다발: '+(on['IF_0093']?'주의':'없음');
  document.getElementById('safetyDetail').textContent=walkTxt;
  if(lastRoute)lastRoute.score=score;
}
function setMode(m){mode=m;document.querySelectorAll('[id^=mode-]').forEach(function(b){b.classList.remove('active')});document.getElementById('mode-'+m).classList.add('active');if(A&&B)findRoute(safetyVisible);}
function clearAll(){A=B=null;fromName='';toName='';lastRoute=null;lastScore=null;pendingRouteColor=null;safetyVisible=false;Object.values(markers).forEach(function(x){x.setMap(null)});markers={};if(routeLine)routeLine.setMap(null);document.getElementById('routeInfo').textContent='—';document.getElementById('safetyBox').style.display='none';document.getElementById('useLoc').checked=false;document.getElementById('fromSearch').value='';document.getElementById('toSearch').value='';document.getElementById('fromResults').innerHTML='';document.getElementById('toResults').innerHTML='';}
function resetRoute(){clearAll();showMsg('','');}
function swapAB(){
  if(!A&&!B) return;
  var t=A;A=B;B=t;
  var tn=fromName;fromName=toName;toName=tn;
  document.getElementById('fromSearch').value=fromName;
  document.getElementById('toSearch').value=toName;
  if(A) setPin('출발',A.lat,A.lng);
  if(B) setPin('도착',B.lat,B.lng);
  if(A&&B){ try{ if(routeLine)routeLine.setMap(null); }catch(e){} findRoute(safetyVisible); }
}
function renderLayers(){var el=document.getElementById('layers');el.innerHTML=LAYERS.map(function(x){return '<label><input type="checkbox" checked onchange="placeAllLayersOnMap(); if(A&&B) findRoute(safetyVisible)"> '+x.name+' <span class="small">'+x.code+'</span></label>'}).join('');}
function toggleLayer(){var p=document.getElementById('layerPanel');p.style.display=p.style.display==='none'?'block':'none';}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveRoute(){
  if(!A||!B||!lastRoute) return alert('먼저 출발과 도착을 찍어 루트를 만드세요.');
  if(lastScore!=null) lastRoute.score=lastScore;
  var memo=document.getElementById('memoText').value.trim();
  var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');
  var color=ROUTE_COLORS[arr.length % ROUTE_COLORS.length];
  lastRoute.color=color;
  lastRoute.memo=memo;
  if(routeLine){ try{ routeLine.setOptions({strokeColor:color}); }catch(e){} }
  arr.unshift(lastRoute);
  localStorage.setItem('ansimgil_routes',JSON.stringify(arr));
  document.getElementById('memoText').value='';
  loadSaved();
  alert('루트 저장 완료');
}
function loadSaved(){
  var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');
  document.getElementById('savedList').innerHTML=arr.map(function(r,i){
    var dot=r.color||ROUTE_COLORS[i % ROUTE_COLORS.length];
    var modeTxt=r.mode==='walk'?'도보':r.mode==='bike'?'자전거':'차량';
    var memoTxt=r.memo ? '<div class="memoTxt">📝 '+esc(r.memo)+'</div>' : '<div class="small">메모 없음</div>';
    var names=(r.fromName||'출발')+' → '+(r.toName||'도착');
    return '<div class="saved" style="border-left:6px solid '+dot+'"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+dot+';margin-right:4px"></span><b>'+esc(names)+'</b><br><span class="small">'+r.at+' · '+modeTxt+' · '+(r.distance/1000).toFixed(2)+'km · 약 '+Math.round(r.duration/60)+'분'+(r.score!=null?' · 안전 '+r.score+'점':'')+'</span><br>'+memoTxt+'<br><button onclick="loadRoute('+i+')">불러오기</button> <button onclick="delRoute('+i+')">삭제</button></div>';
  }).join('')||'<div class="small">—</div>';
}
function loadRoute(i){var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');var r=arr[i];if(!r)return;pendingRouteColor=r.color||ROUTE_COLORS[i % ROUTE_COLORS.length];A=r.A;B=r.B;fromName=r.fromName||'';toName=r.toName||'';document.getElementById('fromSearch').value=fromName;document.getElementById('toSearch').value=toName;mode=r.mode;setMode(mode);setPin('출발',A.lat,A.lng);setPin('도착',B.lat,B.lng);findRoute(safetyVisible);}
function delRoute(i){var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]');arr.splice(i,1);localStorage.setItem('ansimgil_routes',JSON.stringify(arr));loadSaved();}
</script></body></html>
