async function findRouteFallback(){ if(!A||!B) return; var prof=mode==='walk'?'walking':mode==='bike'?'cycling':'driving'; try{ var r=await fetch('https://router.project-osrm.org/route/v1/'+prof+'/'+A.lng+','+A.lat+';'+B.lng+','+B.lat+'?overview=full&geometries=geojson'); var j=await r.json(); var best=(j.routes||[])[0]; if(!best) throw new Error('no route'); if(fallbackLine) fallbackMap.removeLayer(fallbackLine); var coords=best.geometry.coordinates.map(function(c){return [c[1],c[0]];}); fallbackLine=L.polyline(coords,{color:MODE_COLORS[mode]||'#0b2f6b',weight:6}).addTo(fallbackMap); lastRoute={A:A,B:B,mode:mode,distance:best.distance,duration:best.duration,at:new Date().toLocaleString(),fromName:fromName,toName:toName}; document.getElementById('routeInfo').innerHTML='<b>안심루트 (OSM)</b> · '+(mode==='walk'?'도보':mode==='bike'?'자전거':'차량')+' · '+(best.distance/1000).toFixed(2)+'km · 약 '+Math.round(best.duration/60)+'분'; showSafety(best); }catch(e){ document.getElementById('routeInfo').textContent='경로를 불러오지 못했어요.'; } }
function toggleShowLayers(){ layersHidden=!document.getElementById('showLayersChk').checked; placeAllLayersOnMap(); }
function wmsUrlFor(code,bounds){ var sw=bounds.getSouthWest(), ne=bounds.getNorthEast(); return 'https://www.safemap.go.kr/openApiService/wms/getLayer.do?serviceKey='+encodeURIComponent(SAFEMAP_KEY)+'&layer='+encodeURIComponent(code)+'&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS='+encodeURIComponent(code)+'&BBOX='+sw.getLng()+','+sw.getLat()+','+ne.getLng()+','+ne.getLat()+'&WIDTH=1024&HEIGHT=1024&SRS=EPSG:4326&FORMAT=image/png&TRANSPARENT=TRUE'; }
function placeAllLayersOnMap(){
 if(useFallback){ var st=document.getElementById('wmsStatus'); if(st) st.textContent='OSM 모드에서는 WMS 레이어를 지도에 얹지 않고, 안전점수 계산에만 써요.'; return; }
 if(!map) return;
 try{
  var boxes=document.querySelectorAll('#layers input[type=checkbox]');
  var bounds=map.getBounds();
  var checkedCount=0; boxes.forEach(function(b){ if(b.checked) checkedCount++; });
  var st2=document.getElementById('wmsStatus');
  if(st2) st2.textContent='체크된 레이어 '+checkedCount+'개 - WMS는 무겁기 때문에 한 번에 전부 얹지 않고, 안전점수에만 반영해요. 지도에 보고 싶으면 체크를 1~2개만 켜보세요.';
 }catch(e){}
}
function fillInputFromClick(which,lat,lng){ var inputId=which==='A'?'fromSearch':'toSearch'; var input=document.getElementById(inputId); var tempName='지도 찍은 위치'; if(which==='A') fromName=tempName; else toName=tempName; if(input) input.value=tempName; if(geocoder){ try{ geocoder.coord2Address(lng,lat,function(result,status){ if(status===kakao.maps.services.Status.OK && result && result[0]){ var addr=(result[0].road_address&&result[0].road_address.address_name)||(result[0].address&&result[0].address.address_name)||''; if(addr){ if(which==='A') fromName=addr; else toName=addr; if(input) input.value=addr; } } }); }catch(e){} } }
function initMap(){
 try{
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5665,126.9780),level:5});
  if(window.kakao.maps.services){ placesService=new kakao.maps.services.Places(); geocoder=new kakao.maps.services.Geocoder(); }
  kakao.maps.event.addListener(map,'click',function(e){ onMapClick(e.latLng.getLat(),e.latLng.getLng()); });
  renderLayers(); loadSaved();
  setTimeout(function(){ try{ map.relayout(); }catch(e){} },300);
 }catch(e){ startFallback('지도 생성 실패: '+e.message); }
}
if(typeof kakao==='undefined'){ startFallback('카카오 SDK가 안 불러와졌어요. file:// 또는 도메인 미등록이 제일 흔해요.'); }
else{
 kakao.maps.load(initMap);
 setTimeout(function(){ if(!map && !useFallback) startFallback('카카오가 3초 안에 안 떴어요. 도메인 등록을 확인하세요.'); },3000);
}
function onLocToggle(){ var on=document.getElementById('useLoc').checked; if(!on) return; if(!navigator.geolocation){ alert('위치 지원 안 함'); document.getElementById('useLoc').checked=false; return; } navigator.geolocation.getCurrentPosition(function(p){ A={lat:p.coords.latitude,lng:p.coords.longitude}; fromName='내 위치'; document.getElementById('fromSearch').value=fromName; if(useFallback) setPinFallback('A',A.lat,A.lng); else setPin('출발',A.lat,A.lng); document.getElementById('toSearch').focus(); if(B) findRoute(true); },function(){ alert('위치 권한 허용 필요'); document.getElementById('useLoc').checked=false; }); }
function onMapClick(lat,lng){ if(!A){ A={lat:lat,lng:lng}; setPin('출발',lat,lng); fillInputFromClick('A',lat,lng); } else if(!B){ B={lat:lat,lng:lng}; setPin('도착',lat,lng); fillInputFromClick('B',lat,lng); findRoute(true); } else { B={lat:lat,lng:lng}; setPin('도착',lat,lng); fillInputFromClick('B',lat,lng); findRoute(true); } }
function setPin(which,lat,lng){ if(markers[which]) markers[which].setMap(null); markers[which]=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),map:map}); map.setCenter(new kakao.maps.LatLng(lat,lng)); }
function searchPlace(target){ var inputId=target==='A'?'fromSearch':'toSearch'; var kw=document.getElementById(inputId).value.trim(); if(!kw) return; quickSearch(kw,target); }
function quickSearch(kw,target){ if(useFallback){ showMsg('OSM 모드에서는 장소 검색이 안 돼요. 지도에서 직접 찍어보세요.','#fef3c7'); return; } if(!placesService){ alert('장소 검색이 아직 준비 안 됐어요.'); return; } placesService.keywordSearch(kw,function(data,status){ var boxId=target==='A'?'fromResults':'toResults'; if(status!==kakao.maps.services.Status.OK || !data.length){ document.getElementById(boxId).innerHTML='<div class="small">검색 결과가 없어요.</div>'; return; } var list=data.slice(0,5); document.getElementById(boxId).innerHTML=list.map(function(p){ var name=(p.place_name||'').replace(/'/g,'’').replace(/"/g,'”'); var lat=parseFloat(p.y), lng=parseFloat(p.x); return '<div onclick="pickPlaceDirect(\''+target+'\', '+lat+', '+lng+', \''+name+'\')"><b>'+escHtml(p.place_name)+'</b><br><span class="small">'+escHtml(p.road_address_name||p.address_name||'')+'</span></div>'; }).join(''); }); }
function renderNearbyList(data,kwLabel){ var box=document.getElementById('nearbyResults'); nearbyMarkers.forEach(function(m){ m.setMap(null); }); nearbyMarkers=[]; if(!data||!data.length){ box.innerHTML='<div class="small">주변에 '+escHtml(kwLabel)+' 결과가 없어요.</div>'; return; } var list=data.slice(0,10); var bounds=new kakao.maps.LatLngBounds(); list.forEach(function(p){ var lat=parseFloat(p.y), lng=parseFloat(p.x); var mk=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),map:map}); kakao.maps.event.addListener(mk,'click',function(){ pickPlaceDirect('B',lat,lng,p.place_name||'선택한 장소'); }); nearbyMarkers.push(mk); bounds.extend(new kakao.maps.LatLng(lat,lng)); }); try{ map.setBounds(bounds); }catch(e){} box.innerHTML='<div class="small" style="padding:6px 11px 0">주변 '+escHtml(kwLabel)+' '+list.length+'개 — 눌러서 도착으로 설정</div>'+list.map(function(p){ var name=(p.place_name||'').replace(/'/g,'’').replace(/"/g,'”'); var lat=parseFloat(p.y), lng=parseFloat(p.x); var dist=p.distance?' · '+p.distance+'m':''; return '<div onclick="pickPlaceDirect(\'B\', '+lat+', '+lng+', \''+name+'\')"><b>'+escHtml(p.place_name)+'</b><br><span class="small">'+escHtml(p.road_address_name||p.address_name||'')+dist+'</span></div>'; }).join(''); }
function clearNearby(){ nearbyMarkers.forEach(function(m){ try{m.setMap(null);}catch(e){} }); nearbyMarkers=[]; var box=document.getElementById('nearbyResults'); if(box) box.innerHTML=''; document.querySelectorAll('.nearbyRow button').forEach(function(b){ b.classList.remove('active'); }); }
function searchNearby(code,kwLabel,btn){ if(useFallback){ document.getElementById('nearbyResults').innerHTML='<div class="small">OSM 모드에서는 주변검색이 안 돼요. 카카오 지도가 뜰 때만 돼요.</div>'; return; } var box=document.getElementById('nearbyResults'); if(!map){ alert('지도가 아직 안 떴어요.'); return; } if(!placesService){ box.innerHTML='<div class="small">장소 검색 서비스가 아직 준비 안 됐어요.</div>'; return; } if(btn && btn.classList.contains('active')){ clearNearby(); return; } document.querySelectorAll('.nearbyRow button').forEach(function(b){ b.classList.remove('active'); }); if(btn) btn.classList.add('active'); box.innerHTML='<div class="small">주변 '+escHtml(kwLabel)+' 검색 중…</div>'; var center=map.getCenter(); try{ placesService.categorySearch(code,function(data,status){ if(status===kakao.maps.services.Status.OK && data && data.length){ renderNearbyList(data,kwLabel); return; } placesService.keywordSearch(kwLabel,function(data2,status2){ if(status2===kakao.maps.services.Status.OK && data2 && data2.length){ renderNearbyList(data2,kwLabel); return; } box.innerHTML='<div class="small">주변에 '+escHtml(kwLabel)+' 결과가 없어요.</div>'; },{location:center,radius:3000}); },{location:center,radius:3000,sort:kakao.maps.services.SortBy.DISTANCE}); }catch(e){ box.innerHTML='<div class="small">주변검색 실패: '+escHtml(e.message)+'</div>'; } }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pickPlaceDirect(which,lat,lng,name){ if(!name) name='선택한 장소'; var inputId=which==='A'?'fromSearch':'toSearch'; var input=document.getElementById(inputId); if(input) input.value=name; if(which==='A'){ A={lat:lat,lng:lng}; fromName=name; setPin('출발',lat,lng); document.getElementById('fromResults').innerHTML=''; document.getElementById('toSearch').focus(); } else { B={lat:lat,lng:lng}; toName=name; setPin('도착',lat,lng); document.getElementById('toResults').innerHTML=''; } if(A&&B) findRoute(true); }
function resolveTyped(which){ return new Promise(function(resolve){ var inputId=which==='A'?'fromSearch':'toSearch'; var txt=document.getElementById(inputId).value.trim(); if(!txt){ resolve(false); return; } if(which==='A' && A && fromName===txt){ resolve(true); return; } if(which==='B' && B && toName===txt){ resolve(true); return; } if(!placesService || !geocoder){ resolve(false); return; } placesService.keywordSearch(txt,function(data,status){ if(status===kakao.maps.services.Status.OK && data && data.length){ var p=data[0]; var lat=parseFloat(p.y), lng=parseFloat(p.x); var name=p.place_name||txt; if(which==='A'){ A={lat:lat,lng:lng}; fromName=name; setPin('출발',lat,lng); } else { B={lat:lat,lng:lng}; toName=name; setPin('도착',lat,lng); } document.getElementById(inputId).value=name; resolve(true); return; } geocoder.addressSearch(txt,function(res2,st2){ if(st2===kakao.maps.services.Status.OK && res2 && res2.length){ var r=res2[0]; var lat2=parseFloat(r.y), lng2=parseFloat(r.x); if(which==='A'){ A={lat:lat2,lng:lng2}; fromName=txt; setPin('출발',lat2,lng2); } else { B={lat:lat2,lng:lng2}; toName=txt; setPin('도착',lat2,lng2); } resolve(true); return; } resolve(false); }); }); }); }
async function confirmRoute(){ if(useFallback){ if(!A||!B){ alert('지도에서 출발과 도착을 찍어주세요.'); return; } findRouteFallback(); return; } if(!A) await resolveTyped('A'); if(!B) await resolveTyped('B'); if(!A||!B){ alert('출발과 도착을 먼저 정해주세요. 검색해서 선택하세요.'); return; } await findRoute(true); }
async function fetchOneRoute(prof){ var url='https://router.project-osrm.org/route/v1/'+prof+'/'+A.lng+','+A.lat+';'+B.lng+','+B.lat+'?overview=full&geometries=geojson&alternatives=1'; var r=await fetch(url); var j=await r.json(); return (j.routes||[])[0]||null; }
async function findRoute(showScore){ if(useFallback){ findRouteFallback(); return; } if(!A||!B) return; var prof=mode==='walk'?'walking':mode==='bike'?'cycling':'driving'; try{ var best=await fetchOneRoute(prof); if(!best) throw new Error('no route'); if(routeLine) routeLine.setMap(null); var path=best.geometry.coordinates.map(function(c){ return new kakao.maps.LatLng(c[1],c[0]); }); var lineColor=pendingRouteColor||MODE_COLORS[mode]||'#0b2f6b'; routeLine=new kakao.maps.Polyline({path:path,strokeWeight:6,strokeColor:lineColor,strokeOpacity:.9}); routeLine.setMap(map); lastRoute={A:A,B:B,mode:mode,distance:best.distance,duration:best.duration,at:new Date().toLocaleString(),color:lineColor,fromName:fromName,toName:toName}; pendingRouteColor=null; document.getElementById('routeInfo').innerHTML='<b>안심루트</b> · '+(mode==='walk'?'도보':mode==='bike'?'자전거':'차량')+' · 거리 '+(best.distance/1000).toFixed(2)+'km · 약 '+Math.round(best.duration/60)+'분<br><span class="small" id="modeCompare"></span>'; showSafety(best); }catch(e){ document.getElementById('routeInfo').textContent='경로를 불러오지 못했어요.'; } }
function checkedCodes(){ var boxes=document.querySelectorAll('#layers input[type=checkbox]'); var s={}; LAYERS.forEach(function(L,i){ if(boxes[i] && boxes[i].checked) s[L.code]=true; }); return s; }
function showSafety(best){ var on=checkedCodes(); var facPlus=0, danMinus=0, facCount=0, danCount=0; var bigMinus={ 'IF_0087':5, 'IF_0081':4, 'IF_0082':4, 'IF_0080':4, 'IF_0075':4, 'IF_0093':4, 'IF_0094':3, 'IF_0103':3 }; Object.keys(bigMinus).forEach(function(c){ if(on[c]){ danCount++; danMinus+=bigMinus[c]; } }); var plusMap={ 'IF_0036':2, 'IF_0055':2, 'IF_0032':2, 'IF_0131':2, 'IF_0102':2, 'IF_0053':2 }; Object.keys(plusMap).forEach(function(c){ if(on[c]){ facCount++; facPlus+=plusMap[c]; } }); var weakPlus={ 'IF_0095':1, 'IF_0097':1, 'IF_0098':1, 'IF_0101':1, 'IF_0096':1 }; Object.keys(weakPlus).forEach(function(c){ if(on[c]){ facCount++; facPlus+=weakPlus[c]; } }); if(facPlus>10) facPlus=10; if(danMinus>15) danMinus=15; var hour=new Date().getHours(); var isNight=hour>=20||hour<6; var score=75+facPlus-danMinus; if(best.distance>3000) score-=2; if(best.distance>8000) score-=2; if(isNight) score-=3; if(score>92) score=92; if(score<55) score=55; lastScore=score; var grade=score>=88?'매우 안전':score>=78?'안전':score>=68?'보통':'주의 필요'; document.getElementById('safetyBox').style.display='block'; document.getElementById('safetyScore').textContent='안전 점수 '+score+'점'; document.getElementById('safetyGrade').textContent='· '+grade; document.getElementById('safetyBar').style.width=score+'%'; document.getElementById('safetyFac').textContent='✅ 안전시설 '+facCount+'개 +'+facPlus+'점'; document.getElementById('safetyDanger').textContent='⚠️ 위험지역 '+danCount+'개 -'+danMinus+'점'; var walkTxt=mode==='walk'?'🚶 인도: '+(on['IF_0095']?'확인됨':'없음')+' · 🔶 횡단보도: '+(on['IF_0097']?'확인됨':'없음')+' · 스쿨존: '+(on['IF_0098']?'확인됨':'없음'):mode==='bike'?'🚲 자전거길: '+(on['IF_0101']?'확인됨':'없음')+' · 🚶 인도: '+(on['IF_0095']?'확인됨':'없음'): '🚗 가드레일: '+(on['IF_0096']?'확인됨':'없음')+' · 결빙구간: '+(on['IF_0103']?'주의':'없음'); document.getElementById('safetyDetail').textContent=walkTxt; if(lastRoute) lastRoute.score=score; }
function setMode(m){ mode=m; document.querySelectorAll('[id^=mode-]').forEach(function(b){ b.classList.remove('active') }); document.getElementById('mode-'+m).classList.add('active'); if(A&&B) findRoute(true); }
function clearAll(){ A=B=null; fromName=''; toName=''; lastRoute=null; lastScore=null; pendingRouteColor=null; Object.values(markers).forEach(function(x){ x.setMap(null) }); markers={}; nearbyMarkers.forEach(function(m){ m.setMap(null) }); nearbyMarkers=[]; document.querySelectorAll('.nearbyRow button').forEach(function(b){ b.classList.remove('active') }); if(routeLine) routeLine.setMap(null); if(fallbackLine && fallbackMap) fallbackMap.removeLayer(fallbackLine); fallbackLine=null; fallbackMarkers.forEach(function(m){ try{ fallbackMap.removeLayer(m);}catch(e){} }); fallbackMarkers=[]; document.getElementById('routeInfo').textContent='출발지를 선택하세요.'; document.getElementById('safetyBox').style.display='none'; document.getElementById('useLoc').checked=false; document.getElementById('fromSearch').value=''; document.getElementById('toSearch').value=''; document.getElementById('fromResults').innerHTML=''; document.getElementById('toResults').innerHTML=''; document.getElementById('nearbyResults').innerHTML=''; }
function resetRoute(){ clearAll(); showMsg('',''); }
function swapAB(){ if(!A&&!B) return; var t=A; A=B; B=t; var tn=fromName; fromName=toName; toName=tn; document.getElementById('fromSearch').value=fromName; document.getElementById('toSearch').value=toName; if(useFallback){ if(A) setPinFallback('A',A.lat,A.lng); if(B) setPinFallback('B',B.lat,B.lng); if(A&&B) findRouteFallback(); return; } if(A) setPin('출발',A.lat,A.lng); if(B) setPin('도착',B.lat,B.lng); if(A&&B) findRoute(true); }
function renderLayers(){ var el=document.getElementById('layers'); el.innerHTML=LAYERS.map(function(x){ return '<label><input type="checkbox" checked onchange="placeAllLayersOnMap(); if(A&&B) findRoute(true)"> '+x.name+' <span class="small">'+x.code+'</span></label>' }).join(''); }
function toggleLayer(){ var p=document.getElementById('layerPanel'); p.style.display=p.style.display==='none'?'block':'none'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveRoute(){ if(!A||!B||!lastRoute) return alert('먼저 출발과 도착을 찍어 루트를 만드세요.'); if(lastScore!=null) lastRoute.score=lastScore; var memo=document.getElementById('memoText').value.trim(); var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]'); var color=ROUTE_COLORS[arr.length % ROUTE_COLORS.length]; lastRoute.color=color; lastRoute.memo=memo; if(routeLine){ try{ routeLine.setOptions({strokeColor:color}); }catch(e){} } arr.unshift(lastRoute); localStorage.setItem('ansimgil_routes',JSON.stringify(arr)); document.getElementById('memoText').value=''; loadSaved(); alert('루트 저장 완료'); }
function loadSaved(){ var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]'); document.getElementById('savedList').innerHTML=arr.map(function(r,i){ var dot=r.color||ROUTE_COLORS[i % ROUTE_COLORS.length]; var modeTxt=r.mode==='walk'?'도보':r.mode==='bike'?'자전거':'차량'; var memoTxt=r.memo?'<div class="memoTxt">📝 '+esc(r.memo)+'</div>':'<div class="small">메모 없음</div>'; var names=(r.fromName||'출발')+' → '+(r.toName||'도착'); return '<div class="saved" style="border-left:6px solid '+dot+'"><b>'+esc(names)+'</b><br><span class="small">'+r.at+' · '+modeTxt+' · '+(r.distance/1000).toFixed(2)+'km · 약 '+Math.round(r.duration/60)+'분'+(r.score!=null?' · 안전 '+r.score+'점':'')+'</span><br>'+memoTxt+'<br><button onclick="loadRoute('+i+')">불러오기</button> <button onclick="delRoute('+i+')">삭제</button></div>'; }).join('')||'<div class="small">—</div>'; }
function loadRoute(i){ var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]'); var r=arr[i]; if(!r) return; pendingRouteColor=r.color||ROUTE_COLORS[i % ROUTE_COLORS.length]; A=r.A; B=r.B; fromName=r.fromName||''; toName=r.toName||''; document.getElementById('fromSearch').value=fromName; document.getElementById('toSearch').value=toName; mode=r.mode; setMode(mode); if(useFallback){ setPinFallback('A',A.lat,A.lng); setPinFallback('B',B.lat,B.lng); findRouteFallback(); return; } setPin('출발',A.lat,A.lng); setPin('도착',B.lat,B.lng); findRoute(true); }
function delRoute(i){ var arr=JSON.parse(localStorage.getItem('ansimgil_routes')||'[]'); arr.splice(i,1); localStorage.setItem('ansimgil_routes',JSON.stringify(arr)); loadSaved(); }
</script></body></html>
