<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=894d3481b0040f5f9b3de9972193f07d&libraries=services&autoload=false"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#eef7f0;color:#1a2e22;-webkit-font-smoothing:antialiased;font-size:13px}
header{min-height:48px;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #e5e7eb}header b{font-size:17px;font-weight:900;letter-spacing:-.3px}
header button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}
#msg{background:#fef3c7;padding:8px 16px;font-size:13px;display:none}
.layout{display:flex;align-items:stretch;height:calc(100vh - 48px);min-height:560px}
.mapWrap{flex:1.55;min-width:0;background:#e8eaf6;overflow:hidden;position:relative}
#map{width:100%;height:100%;min-height:100%;background:#e8eaf6;display:block}
.panel{flex:1;min-width:340px;max-width:520px;background:#f7fdf8;border-left:1px solid #e5e7eb;padding:14px 14px 18px;overflow-y:auto;height:100%}
.titleWrap{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px 12px;background:linear-gradient(135deg,#ecfdf5 0%,#eff6ff 100%);border:1px solid #d1fae5;border-radius:14px}
.titleIcon{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#166534;border-radius:12px;box-shadow:0 4px 12px rgba(22,101,52,.25)}
.titleWrap h2{margin:0;font-size:22px;line-height:1.2;font-weight:900;letter-spacing:-.5px;color:#14532d}
.titleWrap h2 span{color:#166534}
.titleWrap p{margin:2px 0 0;font-size:12px;font-weight:500;color:#4b5563;letter-spacing:-.2px}
.searchLabel{font-size:12px;font-weight:800;margin:14px 0 6px;display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}.dot-a{background:#16a34a}.dot-b{background:#dc2626}
.searchBox{display:flex;align-items:center;gap:8px;border:1.5px solid #b9d9c2;border-radius:11px;padding:7px 7px 7px 11px;background:#fff;box-shadow:none;overflow:hidden}.searchBox:focus-within{border-color:#16a34a;box-shadow:0 0 0 3px #dcfce7}
.searchBox input{flex:1;min-width:0;border:none!important;border-width:0!important;outline:none!important;box-shadow:none!important;background:transparent!important;background-color:transparent!important;padding:0!important;margin:0!important;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:#111827;-webkit-appearance:none;appearance:none}.searchBox input::placeholder{color:#9ca3af}
.searchBox button{flex:0 0 auto;border:0;background:#166534;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:800;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}
.searchRes:empty{display:none}.searchRes{margin-top:6px;background:#fff;border:1px solid #e5e7eb;border-radius:11px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.06)}.searchRes>div{padding:10px 11px;cursor:pointer;border-bottom:1px solid #f3f4f6;line-height:1.5;font-size:12px}.searchRes>div:last-child{border-bottom:0}.searchRes>div:hover{background:#f0fdf4}.searchRes .small{font-size:11px;color:#6b7280}
.swapWrap{display:flex;align-items:center;justify-content:center;position:relative;height:32px;margin:10px 0}.swapWrap:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#d9e8dd}.swapBtn{position:relative;z-index:1;width:26px;height:26px;min-width:26px;border-radius:50%;border:2px solid #fff;background:#166534;color:#fff;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(22,101,52,.25);line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0}button{border:1px solid #ddd;background:#fff;padding:6px 9px;border-radius:999px;cursor:pointer;font-size:12px;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}button.active{background:#0b2f6b;color:#fff;border-color:#0b2f6b}
.confirmRow{display:flex;gap:8px;justify-content:flex-end;padding:12px 0 6px}
.confirmBtn{border:0;background:#166534;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(22,101,52,.25)}
.confirmBtn:active{transform:translateY(1px)}
.resetBtn{border:1px solid #e5e7eb;background:#fff;color:#374151;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}
.resetBtn:active{transform:translateY(1px)}
.mode-btn{min-width:48px;font-size:10px;font-weight:700;padding:4px 5px;line-height:1.2;border-width:1.5px;border-radius:999px}.mode-btn .ico{font-size:14px;display:block;line-height:1;margin-bottom:1px}
#mode-walk{border-color:#fdba74;color:#9a3412}#mode-walk .ico{color:#ea580c}
#mode-bike{border-color:#6ee7b7;color:#065f46}#mode-bike .ico{color:#059669}
#mode-car{border-color:#93c5fd;color:#1e3a8a}#mode-car .ico{color:#1d4ed8}
#mode-walk.active{background:#fff7ed;border-color:#ea580c;color:#9a3412;box-shadow:0 0 0 2px #ffedd5}
#mode-bike.active{background:#ecfdf5;border-color:#059669;color:#065f46;box-shadow:0 0 0 2px #d1fae5}
#mode-car.active{background:#1e3a8a;border-color:#1e3a8a;color:#fff;box-shadow:0 0 0 2px #bfdbfe}#mode-car.active .ico{color:#fff}
.modeRow{margin-top:10px;padding:8px 0 2px}
.loc-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:#166534;cursor:pointer;white-space:nowrap;user-select:none;line-height:1}.loc-pill input{-webkit-appearance:none;appearance:none;width:16px;height:16px;flex:0 0 16px;margin:0;cursor:pointer;border:1.5px solid #16a34a;border-radius:4px;background:#fff;display:inline-grid;place-content:center}.loc-pill input:checked{background:#166534;border-color:#166534}.loc-pill input:checked::after{content:"✓";color:#fff;font-size:11px;font-weight:900;line-height:1}.loc-pill:has(input:checked){background:#166534;color:#fff;border-color:#166534}.loc-pill:has(input:checked) input{border-color:#fff;background:#fff}.loc-pill:has(input:checked) input:checked::after{color:#166534}
.nearbyLabel{font-size:12px;font-weight:800;margin:12px 0 5px}
.nearbyRow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.nearbyRow button{padding:6px 11px;font-size:12px;font-weight:700;border:1px solid #dbeafe;background:#fff;color:#1e3a8a;border-radius:999px}.nearbyRow button.active{background:#166534;border-color:#166534;color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.7;margin-top:10px}.small{font-size:11px;color:#666}
#layerPanel{display:none;position:fixed;right:10px;top:58px;width:320px;max-width:92vw;max-height:80vh;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px}
#layerPanel label{display:inline-flex;align-items:center;gap:6px;margin:3px 4px 3px 0;font-size:12px;background:#f8fafc;border:1px solid #eee;border-radius:999px;padding:5px 8px;cursor:pointer}#layerPanel input{accent-color:#166534}
.saved{border:1px solid #dbeafe;background:#eff6ff;border-radius:11px;padding:10px 11px;font-size:12px;margin-bottom:9px;line-height:1.7}.saved .memoTxt{font-weight:700}.saved button{padding:5px 10px;font-size:11px;font-weight:700;border-radius:999px}
.score{margin:12px 0;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.8}.score b{font-size:14px}.score .bar{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:6px 0}.score .bar div{height:100%;background:#059669}
.memoRow{display:flex;gap:8px;align-items:center;margin:14px 0}.memoRow input{flex:1;padding:10px 12px;border:1px solid #e5e7eb;border-radius:999px;font-size:13px;outline:none;min-width:0;background:#fff;font-family:'Noto Sans KR',sans-serif}.memoRow input:focus{border-color:#16a34a;box-shadow:0 0 0 3px #dcfce7}.memoRow button{flex:0 0 auto;border:0;background:#166534;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;white-space:nowrap}
h3{font-weight:800;letter-spacing:-.3px;font-size:14px;margin:14px 0 8px}
@media(max-width:820px){.layout{flex-direction:column;height:auto}.panel{max-width:none;min-width:0;border-left:0;border-top:1px solid #e5e7eb;height:auto;overflow:visible}#map{height:420px;min-height:420px}.mapWrap{height:420px}.loc-pill{margin-left:0}}
</style></head><body>
<header><b>🛡️ 동네안심길</b><span style="margin-left:auto"></span><button onclick="toggleLayer()">레이어</button></header>
<div id="msg"></div>
<div class="layout">
<div class="mapWrap"><div id="map"></div></div>
<div class="panel">
<div class="titleWrap"><div class="titleIcon">🛡️</div><div><h2>우리동네<span>안심길</span></h2><p>안전한 길로, 마음 편히 걸어요</p></div></div>
<div class="row modeRow"><button id="mode-walk" class="active mode-btn" onclick="setMode('walk')"><span class="ico">🚶</span>도보</button><button id="mode-bike" class="mode-btn" onclick="setMode('bike')"><span class="ico">🚲</span>자전거</button><button id="mode-car" class="mode-btn" onclick="setMode('car')"><span class="ico">🚗</span>차량</button><label class="loc-pill"><input type="checkbox" id="useLoc" onchange="onLocToggle()"> 내 위치</label></div>
<div class="nearbyLabel">주변검색</div>
<div class="nearbyRow"><button data-cat="FD6" data-kw="음식점" onclick="searchNearby('FD6','음식점',this)" ondblclick="clearNearby();return false;">🍽️ 음식점</button><button data-cat="CE7" data-kw="카페" onclick="searchNearby('CE7','카페',this)" ondblclick="clearNearby();return false;">☕ 카페</button><button data-cat="CS2" data-kw="편의점" onclick="searchNearby('CS2','편의점',this)" ondblclick="clearNearby();return false;">🏪 편의점</button><button data-cat="HP8" data-kw="병원" onclick="searchNearby('HP8','병원',this)" ondblclick="clearNearby();return false;">🏥 병원</button><button data-cat="PM9" data-kw="약국" onclick="searchNearby('PM9','약국',this)" ondblclick="clearNearby();return false;">💊 약국</button><button data-cat="OL7" data-kw="주유소" onclick="searchNearby('OL7','주유소',this)" ondblclick="clearNearby();return false;">⛽ 주유소</button><button data-cat="PK6" data-kw="주차장" onclick="searchNearby('PK6','주차장',this)" ondblclick="clearNearby();return false;">🅿️ 주차장</button><button data-cat="BK9" data-kw="은행" onclick="searchNearby('BK9','은행',this)" ondblclick="clearNearby();return false;">🏦 은행</button></div>
<div id="nearbyResults" class="searchRes" ondblclick="clearNearby()"></div>
<div class="searchLabel"><span class="dot dot-a"></span> 출발</div>
<div class="searchBox"><input id="fromSearch" type="text" placeholder="출발 검색" onkeydown="if(event.key==='Enter') searchPlace('A')"><button onclick="searchPlace('A')">찾기</button></div>
<div id="fromResults" class="searchRes"></div>
<div class="swapWrap"><button class="swapBtn" onclick="swapAB()" title="출발 ↔ 도착 바꾸기">⇅</button></div>
<div class="searchLabel"><span class="dot dot-b"></span> 도착</div>
<div class="searchBox"><input id="toSearch" type="text" placeholder="도착 검색" onkeydown="if(event.key==='Enter') searchPlace('B')"><button onclick="searchPlace('B')">찾기</button></div>
<div id="toResults" class="searchRes"></div>
<div class="confirmRow"><button class="confirmBtn" onclick="confirmRoute()">확인</button><button class="resetBtn" onclick="resetRoute()">루트 초기화</button></div>
<div class="card" id="routeInfo">—</div>
<div class="score" id="safetyBox" style="display:none"><b id="safetyScore">안전 점수 0점</b> <span id="safetyGrade"></span><div class="bar"><div
